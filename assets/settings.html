<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>设置</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; padding: 24px; background: var(--dsw-alias-bg-layer-1, #232324); color: var(--dsw-alias-label-primary, #e9ebf2); font: 13px/1.6 'Microsoft YaHei', sans-serif; }
h1 { font-size: 18px; margin: 0 0 16px; }
h2 { font-size: 14px; font-weight: 500; margin: 22px 0 8px; }
label { display: block; margin: 10px 0 5px; color: var(--dsw-alias-label-secondary, #a3a7b3); }
input { width: 100%; height: 34px; border: .5px solid var(--dsw-alias-border-l2, #ffffff25); border-radius: 12px; padding: 6px 10px; background: var(--dsw-alias-bg-layer-2, #2c2c2e); color: inherit; font: inherit; color-scheme: dark; }
.row { display: flex; gap: 14px; }.row > div { flex: 1; }
.check { display: flex; gap: 8px; align-items: center; margin-top: 17px; }.check input { width: 16px; height: 16px; }
.themeRow { display: flex; gap: 8px; }
.themeRow button { flex: 1; background: var(--dsw-alias-bg-layer-2, #2c2c2e); color: inherit; border: .5px solid var(--dsw-alias-border-l2, #ffffff25); border-radius: 12px; padding: 8px 12px; font: inherit; cursor: pointer; }
.themeRow button.on { border-color: var(--dsw-alias-state-business-primary, #8398ff); color: var(--dsw-alias-state-business-primary, #8398ff); }
.check-line { margin: 6px 0 8px; color: var(--dsw-alias-label-secondary, #a3a7b3); }
#recompute { background: var(--dsw-alias-bg-layer-2, #2c2c2e); color: inherit; border: .5px solid var(--dsw-alias-border-l2, #ffffff25); border-radius: 12px; padding: 8px 12px; font: inherit; cursor: pointer; }
#recompute:disabled { opacity: .5; cursor: default; }
button[type=submit] { background: var(--dsw-alias-button-primary-fill, #f9fafb); color: var(--dsw-alias-bg-base, #151517); border: 0; border-radius: 12px; padding: 8px 16px; font: inherit; cursor: pointer; margin-top: 6px; }
button[type=submit]:disabled { opacity: .5; cursor: default; }
#feedback { min-height: 23px; color: var(--dsw-alias-state-warn-primary, #f0bf69); margin: 10px 0; }
.hint { font-size: 11px; color: var(--dsw-alias-label-tertiary, #9398a6); margin-top: 16px; }
:focus-visible { outline: 2px solid var(--dsw-alias-state-business-primary, #8398ff); outline-offset: 2px; }
</style>
<h1>设置</h1>
<form id="form">
  <label for="salary">月薪（税后）</label><input id="salary" type="number" min="0" step="100" required>
  <label for="days">每月工作日</label><input id="days" type="number" min="1" max="31" step="0.5" required>
  <div class="row"><div><label for="start">上班时间</label><input id="start" type="time" required></div><div><label for="end">下班时间</label><input id="end" type="time" required></div></div>
  <label for="lunch">午休时长（小时）</label><input id="lunch" type="number" min="0" max="23" step="0.5" required>
  <label class="check"><input id="weekend" type="checkbox">周末也算上班</label>
  <h2>外观</h2>
  <div class="themeRow" id="themeRow"><button type="button" data-theme="dark">深色</button><button type="button" data-theme="light">浅白</button><button type="button" data-theme="gold">暗金</button></div>
  <h2>自检</h2>
  <p class="check-line" id="checkLine">正在读取…</p>
  <button type="button" id="recompute">重算今天的账</button>
  <p id="feedback" role="status"></p><button id="save" type="submit" disabled>保存参数</button>
</form>
<p class="hint">午休从中午 12 点起计算，并限制在你的班次内。模型饭钱按已识别模型的 token 用量估算，单价核对日期为 2026-11-03。外观点了立即生效。</p>
<script>
const fields = ['salary', 'days', 'start', 'end', 'lunch', 'weekend'];
let revision;
let currentTheme = 'dark';
const feedback = document.getElementById('feedback');
const save = document.getElementById('save');
const theme = getComputedStyle(parent.document.body);
for (const key of theme) if (key.startsWith('--dsw-')) document.documentElement.style.setProperty(key, theme.getPropertyValue(key));
function setTheme(value) {
  currentTheme = ['light', 'gold'].includes(value) ? value : 'dark';
  for (const button of document.querySelectorAll('#themeRow button')) button.classList.toggle('on', button.dataset.theme === currentTheme);
}
for (const button of document.querySelectorAll('#themeRow button')) button.addEventListener('click', () => {
  setTheme(button.dataset.theme);
  parent.postMessage({ type: 'salary-meter:theme', theme: currentTheme }, location.origin);
});
const checkLine = document.getElementById('checkLine');
const recompute = document.getElementById('recompute');
function showCheck(state) {
  const today = state.today || {};
  const prices = state.prices || {};
  checkLine.textContent = `今日已算 ${today.known ?? 0} 笔、未算 ${today.unknown ?? 0} 笔，合计 ¥${Number(today.expense ?? 0).toFixed(2)}；价格表：${prices.source || '内置'}${prices.count ? '，' + prices.count + ' 个模型' : ''}`;
}
recompute.addEventListener('click', async () => {
  recompute.disabled = true;
  checkLine.textContent = '正在重算…';
  try {
    const response = await fetch('/api/salary-meter/recompute', { method: 'POST' });
    const value = await response.json();
    if (!response.ok) throw new Error(value.error || '重算失败');
    showCheck({ today: value.today, prices: value.prices });
    checkLine.textContent += `（扫了 ${value.sessions} 个会话，其中已关闭 ${value.archived ?? 0} 个）`;
  } catch (error) { checkLine.textContent = error.message; }
  finally { recompute.disabled = false; }
});
async function load() {
  const response = await fetch('/api/salary-meter/state');
  if (!response.ok) throw new Error('参数读取失败，请重新打开设置');
  const state = await response.json();
  revision = state.revision;
  for (const key of fields) {
    const input = document.getElementById(key);
    if (key === 'weekend') input.checked = state.config[key];
    else input.value = state.config[key];
  }
  setTheme(state.view && state.view.theme);
  showCheck(state);
  save.disabled = false;
}
document.getElementById('form').addEventListener('submit', async event => {
  event.preventDefault();
  save.disabled = true;
  feedback.textContent = '正在保存…';
  const config = Object.fromEntries(fields.map(key => {
    const input = document.getElementById(key);
    return [key, key === 'weekend' ? input.checked : ['salary', 'days', 'lunch'].includes(key) ? Number(input.value) : input.value];
  }));
  try {
    const response = await fetch('/api/salary-meter/config', { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ config, revision }) });
    const result = await response.json();
    if (!response.ok) throw new Error(result.error);
    revision = result.revision;
    parent.postMessage({ type: 'salary-meter:config-saved', ...result }, location.origin);
  } catch (error) { feedback.textContent = error.message; }
  finally { save.disabled = false; }
});
load().catch(error => { feedback.textContent = error.message; });
</script>
</html>
