<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' ipc: http://ipc.localhost blob:">
<title>计价器</title>
<link rel="stylesheet" href="assets/widget.css">
<style>
  *{box-sizing:border-box}

  html,body{
    margin:0;padding:0;
    width:100%;height:100%;
    background:transparent;
    overflow:hidden;
    font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;
    user-select:none;
    cursor:default;
  }

  /* 窗口跟内容一样大，不留透明边，免得挡住底下窗口的点击 */
  [data-salary-meter]{
    position:absolute;
    left: 0; top: 0; right: auto; bottom: auto;
    width: 440px; height: 390px;
    -webkit-app-region:no-drag;
    transition:height .18s ease;
  }
  [data-salary-meter][data-expanded='true']{height:500px}

  /* 收起时和插件一样：只留顶部信息、余额和下班倒计时 */
  [data-salary-meter][data-expanded='false'] .sm-ledger,
  [data-salary-meter][data-expanded='false'] .sm-mascot,
  [data-salary-meter][data-expanded='false'] .sm-bubble,
  [data-salary-meter][data-expanded='false'] .sm-worktime progress{display:none}

  /* 彩蛋期间收起态也要看得见台词：特异性 (0,4,0) 压过上面那条 display:none，
     只在 data-egg 期间生效，其他场景收起态照旧不显示。位置挪到人物头右侧，
     避开顶部信息行和底部金额行（基线 top 14px 会撞到顶部）。 */
  [data-salary-meter][data-expanded='false'][data-egg='true'] .sm-bubble{
    display:block;top:120px;left:auto;right:10px;max-width:168px;
  }
  /* hidden 必须还能盖住上面那条：(0,5,0) > (0,4,0)。否则收起态台词会一直挂到 10 秒，
     跟展开态 3 秒收起不一致。 */
  [data-salary-meter][data-expanded='false'][data-egg='true'] .sm-bubble[hidden]{
    display:none;
  }

  .sm-icon,
  .sm-toggle{
    background:transparent;
    border:0;
    cursor:pointer;
    padding:0;
    font-family:inherit;
    -webkit-app-region:no-drag;
  }
  .sm-icon{
    width:22px;height:21px;
    border-radius:6px;
    color:var(--sm-muted);
    font-size:13px;
    line-height:21px;
  }
  .sm-icon:hover{background:rgba(140,140,150,.16);color:var(--sm-text)}

  .sm-toggle{font:inherit;color:var(--sm-blue)}
  [data-salary-meter] .sm-error{
    position:absolute;left:0;right:0;bottom:0;
    margin:0;padding:6px 8px;
    background:var(--sm-bg);
    color:#ef8888;
    font-size:11px;
  }

  /* 设置浮层：铺满整个窗口，Windows 这边开第二个 webview 会卡住，所以走同一窗口。
     2026-11-10：改为和挂件同一套三主题实色，不再用浅色磨砂底压深色主题。 */
  .sm-layer{
    position:absolute;inset:0;
    display:flex;flex-direction:column;
    background:var(--panel,#202c3d);
    border:1px solid var(--rule,#455872);
    border-radius:14px;
    overflow:hidden;
    z-index:50;
  }
  .sm-layer[hidden]{display:none}
  /* An underlying native drag region can steal iframe range/input gestures. */
  body.settings-open [data-salary-meter]{visibility:hidden;pointer-events:none;-webkit-app-region:no-drag}
  .sm-layer,.sm-layer iframe{-webkit-app-region:no-drag}
  .sm-layer-bar{
    height:48px;
    flex:none;
    display:flex;align-items:center;
    padding:0 14px 0 24px;
    background:var(--panel,#202c3d);
    border-bottom:1px solid var(--rule,#455872);
    color:var(--ink,#edf3ff);
    font-size:18px;
    font-weight:600;
    letter-spacing:0;
    -webkit-app-region:drag;
  }
  .sm-layer-bar button{
    -webkit-app-region:no-drag;
    width:30px;height:30px;
    margin-left:4px;
    border:0;border-radius:8px;
    background:transparent;
    color:var(--ink-2,#c1d0e5);
    font-size:20px;line-height:28px;
    cursor:pointer;
  }
  .sm-layer-bar button:hover{background:var(--rule,#455872);color:var(--ink,#edf3ff)}
  .sm-layer-bar button:focus-visible{outline:2px solid var(--accent,#9eb6e4);outline-offset:1px}
  .sm-layer iframe{flex:1;width:100%;border:0;background:transparent;overflow:auto}
  .sm-layer-bar{height:48px;padding:0 14px 0 24px;font-size:18px;letter-spacing:0;border-bottom:1px solid var(--rule,#455872)}
  .settings-save-note{margin-left:auto;margin-right:10px;font-size:11px;font-weight:400;color:var(--ink-2,#c1d0e5)}
</style>
<link rel="stylesheet" href="assets/desktop-pet.css">
<link rel="stylesheet" href="assets/fonts.css">
<link rel="stylesheet" href="assets/settings-theme.css">
</head>
<body>

<section data-salary-meter data-theme="dark" data-expanded="false" aria-label="打工养肥鱼" id="widget">
  <button class="sm-mascot" id="mascotBtn" aria-label="鲸鱼娘">
    <span class="sm-stage" id="petStage" hidden>
      <video class="sm-video" id="petVideoA" muted playsinline preload="auto" aria-hidden="true"></video>
      <video class="sm-video" id="petVideoB" muted playsinline preload="auto" aria-hidden="true"></video>
    </span>
  </button>

  <div class="sm-balance" id="balanceRow" role="button" tabindex="0" aria-label="查看今日账目" title="当日工资减去已统计的模型花费估算">
    <small class="sm-food-label" id="balanceLabel">鱼粮</small>
    <span class="sm-money" id="balanceMoney">
      <small id="balancePrefix"></small><small id="balanceCurrency">¥</small><span id="balanceValue">0.00</span>
      <span class="sm-delta" id="balanceArrow" aria-hidden="true"></span>
    </span>
    <span id="toggleBtn" class="sm-toggle" role="button" tabindex="0" aria-label="展开账目" aria-expanded="false"><span id="petStatus"></span></span>
  </div>

  <div class="sm-ledger" id="ledgerRow" data-countdown="true" role="region" aria-label="今日账目">
    <div class="sm-ledger-head">
      <b class="sm-ledger-title" id="statusTitle">今日账目</b>
      <span class="sm-ledger-meta"><time class="sm-clock" id="clockText">00:00:00</time><button class="sm-icon" id="settingsBtn" title="设置" aria-label="设置">⋯</button></span>
    </div>
    <div class="sm-ledger-timing" id="worktimeRow">
      <div class="sm-ledger-count"><span id="countdownLabel">距下班</span><b id="countdownText">--:--:--</b></div>
      <progress id="progressBar" value="0" max="1" aria-label="今日工作进度"></progress>
    </div>
    <div class="sm-ledger-money">
      <div>
        <span class="sm-ledger-label">今日入账</span>
        <b id="earnedText">¥0.00</b>
      </div>
      <div class="sm-expense">
        <span class="sm-ledger-label" id="expenseLabel">肥鱼饭钱 · 估算</span>
        <b id="spentText">¥−0.00</b>
      </div>
    </div>
  </div>

  <div class="sm-bubble" id="bubble">再吃一口就收工。</div>

  <p class="sm-error" id="errorBox" role="alert" hidden></p>
</section>

<div class="sm-layer" id="settingsLayer" data-settings-theme="dark" hidden>
  <div class="sm-layer-bar">
    <span id="settingsDragArea">设置</span><small class="settings-save-note">自动保存</small>
    <button id="settingsClose" title="关闭设置" aria-label="关闭设置">×</button>
  </div>
  <iframe id="settingsFrame" title="设置" src="about:blank"></iframe>
</div>

<script src="tauri-shim.js"></script>
<script type="module" src="widget.js"></script>
<script src="settlement-trigger.js"></script>
</body>
</html>
