<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'">
<title>设置</title>
<style>
  :root{
    --paper:transparent;
    --paper-deep:transparent;
    --shell:rgba(255,255,255,.4);
    --ink:#1b1f24;
    --ink-2:#5b636e;
    --ink-3:#8b929c;
    --rule:rgba(20,30,45,.12);
    --amber:#3d6bff;
    --amber-dim:#2f55cc;
    --lamp-on:#d94a4a;
  }

  *{box-sizing:border-box;margin:0;padding:0}
  html,body,input,button,select,textarea{-webkit-app-region:no-drag}

  body{
    background:transparent;
    color:var(--ink);
    font-family:'Salary Noto Sans SC',sans-serif;
    font-size:13px;
    padding:16px 24px 14px;
    min-height:100vh;
  }

  .head{
    display:flex;
    align-items:baseline;
    gap:12px;
    padding-bottom:9px;
    border-bottom:1px solid var(--rule);
    margin-bottom:14px;
  }

  .head h1{
    font-family:'Salary Noto Sans SC',sans-serif;
    font-size:19px;
    font-weight:600;
    letter-spacing:.14em;
    text-indent:.14em;
    line-height:1;
  }

  .head span{
    font-family:inherit;
    font-size:12px;
    color:var(--ink-2);
    letter-spacing:.06em;
  }

  .form{display:flex;flex-direction:column;gap:9px}

  .field{display:flex;flex-direction:column;gap:5px}
  .field > label{font-size:11px;color:var(--ink-2);letter-spacing:.05em}

  .check-line{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--rule);border-radius:8px;background:rgba(255,255,255,.42);cursor:pointer;font-size:12px;color:var(--ink)}
  .check-line input{width:15px;height:15px;accent-color:var(--amber);cursor:pointer}
  .check-line small{color:var(--ink-3);font-size:11px;margin-left:auto}

  input[type=number],input[type=time]{
    width:100%;
    font-family:'Salary Noto Sans SC',sans-serif;
    font-size:14px;
    font-variant-numeric:tabular-nums;
    color:var(--ink);
    background:rgba(255,255,255,.62);
    border:1px solid var(--rule);
    border-radius:7px;
    padding:7px 10px;
    box-shadow:none;
    transition:border-color .15s ease, box-shadow .15s ease;
  }

  input:focus{
    outline:none;
    border-color:rgba(61,107,255,.6);
    box-shadow:0 0 0 3px rgba(61,107,255,.14);
  }

  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

  .check{
    display:flex;align-items:center;gap:8px;
    font-size:12px;color:var(--ink-2);
    cursor:pointer;user-select:none;
    margin-top:2px;
  }
  .check input{accent-color:var(--lamp-on);width:14px;height:14px;cursor:pointer}

  /* 外观切换 */
  .seg{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    border:1px solid var(--rule);
    border-radius:7px;
    overflow:hidden;
    background:rgba(255,255,255,.5);
  }
  .seg button{
    font:inherit;
    font-size:12px;
    padding:8px 0;
    border:0;
    background:transparent;
    color:var(--ink-2);
    cursor:pointer;
    transition:background .15s ease, color .15s ease;
  }
  .seg button + button{border-left:1px solid var(--rule)}
  .seg button:hover{background:rgba(20,30,45,.06)}
  .seg button.on{background:rgba(27,31,36,.86);color:#fff}
  .seg button.on:hover{background:rgba(27,31,36,.86)}
  .seg.two{grid-template-columns:1fr 1fr}
  .seg.three{grid-template-columns:1fr 1fr 1fr}

  /* 数据条 */
  .stats{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    border:1px solid var(--rule);
    border-radius:10px;
    background:rgba(255,255,255,.45);
    overflow:hidden;
    margin-top:12px;
  }

  .stat{
    padding:7px 10px;
    display:flex;flex-direction:column;gap:2px;
    border-right:1px solid var(--rule);
  }
  .stat:last-child{border-right:none}

  .stat b{
    font-family:'Salary Noto Sans SC',sans-serif;
    font-size:13px;font-weight:500;
    font-variant-numeric:tabular-nums;
    white-space:nowrap;
  }
  .stat span{font-size:11px;color:var(--ink-2)}
  .stat.hi b{color:#2f55cc}

  .foot{
    margin-top:8px;
    padding-top:8px;
    border-top:1px solid var(--rule);
    display:flex;
    flex-direction:column;
    gap:9px;
  }

  .hint{font-size:11px;color:var(--ink-3);line-height:1.7}

  .diag{font-size:11px;color:var(--lamp-on);min-height:0}

  .checkline{
    font-size:11px;color:var(--ink-2);line-height:1.6;margin:0;
    font-variant-numeric:tabular-nums;
  }

  .diagRow{display:flex;align-items:center;gap:10px;margin-top:6px;flex-wrap:wrap}

  #recompute{
    font:inherit;font-size:12px;
    padding:6px 12px;
    color:var(--ink);
    background:rgba(255,255,255,.6);
    border:1px solid var(--rule);
    border-radius:7px;
    cursor:pointer;
    transition:background .15s ease,border-color .15s ease;
  }
  #recompute:hover{background:rgba(255,255,255,.85);border-color:var(--ink-3)}
  #recompute:disabled{opacity:.5;cursor:default}
</style>
<link rel="stylesheet" href="assets/fonts.css">
<link rel="stylesheet" href="assets/settings-theme.css">
<link rel="stylesheet" href="assets/compact-settings.css">
</head>
<body data-settings-theme="dark">

<div class="head">
  <h1>设置</h1>
  <span>改动即时生效</span>
</div>

<div class="form">
<section class="settings-section"><h2>工资与作息</h2>
<div class="row2"><div class="field"><label for="salary">月薪（税后）</label><input id="salary" type="number" min="0" step="100" inputmode="decimal"></div><div class="field"><label for="days">每月工作日</label><input id="days" type="number" min="1" max="31" step="0.5" inputmode="decimal"></div></div>
<div class="row2"><div class="field"><label for="start">上班时间</label><input id="start" type="time"></div><div class="field"><label for="end">下班时间</label><input id="end" type="time"></div></div>
<div class="field setting-line"><label for="lunch">午休（小时）</label><input id="lunch" type="number" min="0" max="6" step="0.5" inputmode="decimal"></div>
<div class="field setting-line"><label>休息制度</label><div class="seg three" id="segRest"><button type="button" data-rest="double">双休</button><button type="button" data-rest="single">单休</button><button type="button" data-rest="alternate">大小周</button></div></div>
</section>
<section class="settings-section"><h2>挂件外观</h2>
<div class="field setting-line"><label>配色</label><div class="seg" id="seg"><button type="button" data-theme="dark">深色</button><button type="button" data-theme="light">浅白</button><button type="button" data-theme="gold">暗金</button></div></div>
<div class="field size-line"><label for="petScale">大小 <output id="petScaleValue">130%</output></label><input id="petScale" type="range" min="80" max="160" step="5" value="130"><button id="resetPetScale" type="button">恢复默认</button></div>
<label class="check-line"><input type="checkbox" id="animation" checked><span>加载人物动画</span><small>关掉只留鱼粮条，省内存</small></label>
</section><div class="diag" id="diag"></div></div>
<div class="stats">
<div class="stat"><b id="perDay">¥0.00</b><span>每天</span></div>
<div class="stat hi"><b id="perMonth">¥0.00</b><span>本月累计（估算）</span></div>
<div class="stat"><b id="perToken">—</b><span title="最近60分钟合格已完成回答的总输出token ÷ 总流时长（不含空闲时间）">近1小时 token/s</span></div>
</div>
<details class="diagnostics"><summary>账目自检与价格信息</summary><p class="checkline" id="checkLine">正在读取…</p><div class="diagRow"><button type="button" id="recompute">重算今天的账</button><span class="checkline" id="checkResult"></span></div></details>
<div class="foot"><p class="hint">费用按已识别 token 估算。<br>退出挂件可使用托盘菜单。</p></div>

<script src="tauri-shim.js"></script>
<script>
(function () {
  "use strict";

  var DEF = { salary: 5000, days: 22, start: '09:00', end: '18:00', lunch: 1, weekend: false, restMode: 'double', theme: 'dark' };
  // 设置页现在是主窗口里的浮层 iframe：优先用宿主窗口的 api，单独打开时才走兜底
  var hostApi = null;
  try { hostApi = (window.parent && window.parent !== window) ? window.parent.api : null; } catch (e) { hostApi = null; }
  var api = hostApi || window.api || {
    getConfig: function () {
      var s = {};
      try { s = JSON.parse(localStorage.getItem('salary-widget-cfg') || '{}'); } catch (e) {}
      return Promise.resolve(Object.assign({}, DEF, s));
    },
    setConfig: function (p) { try { localStorage.setItem('salary-widget-cfg', JSON.stringify(Object.assign({}, DEF, p))); } catch (e) {} },
    getState: function () { return Promise.resolve({ today: { expense: 0, known: 0, unknown: 0 }, prices: { source: '内置', count: 0 }, sessions: 0 }); },
    recompute: function () { return Promise.resolve({ today: { expense: 0, known: 0, unknown: 0 }, prices: { source: '内置', count: 0 }, sessions: 0 }); }
  };

  var el = {
    salary: document.getElementById('salary'),
    days: document.getElementById('days'),
    start: document.getElementById('start'),
    end: document.getElementById('end'),
    lunch: document.getElementById('lunch'),
    diag: document.getElementById('diag'),
    perToken: document.getElementById('perToken'),
    perDay: document.getElementById('perDay'),
    perMonth: document.getElementById('perMonth'),
    checkLine: document.getElementById('checkLine'),
    checkResult: document.getElementById('checkResult'),
    recompute: document.getElementById('recompute')
  };

  var cfg = Object.assign({}, DEF);
  var currentTheme = 'dark';
  var currentRest = 'double';

  /* 休息制度：double 双休 / single 单休（只休周日）/ alternate 大小周（周六逢双周休） */
  /* 大小周周序号用固定基准连续算，跟挂件同一套规则，不按自然年重置 */
  var WEEK0 = Date.UTC(2026, 0, 5); // 2026-01-05 是周一，作为第 0 周
  function weekIndex(d) {
    var t = Date.UTC(d.getFullYear(), d.getMonth(), d.getDate());
    return Math.floor((t - WEEK0) / 604800000);
  }
  function restOn(d, mode) {
    var wd = d.getDay();
    if (wd !== 0 && wd !== 6) return false;
    if (mode === 'none') return false;
    if (mode === 'single') return wd === 0;
    if (mode === 'alternate') return wd === 0 || weekIndex(d) % 2 === 0;
    return true;
  }
  function setRest(v, syncDays) {
    currentRest = (v === 'single' || v === 'alternate' || v === 'none') ? v : 'double';
    var btns = document.querySelectorAll('#segRest button');
    for (var i = 0; i < btns.length; i++) {
      btns[i].classList.toggle('on', btns[i].getAttribute('data-rest') === currentRest);
    }
    // 用户手动切换制度时，把「每月工作日」带成常见值，免得月累计超过月薪
    if (syncDays) {
      var preset = { double: 22, single: 26, alternate: 24 };
      if (preset[currentRest]) el.days.value = preset[currentRest];
    }
  }

  function setTheme(t) {
    currentTheme = (t === 'light' || t === 'gold') ? t : 'dark';
    document.body.dataset.settingsTheme = currentTheme;
    try {
      var layer = window.parent.document.getElementById('settingsLayer');
      if (layer) layer.dataset.settingsTheme = currentTheme;
    } catch (e) {}
    var btns = document.querySelectorAll('#seg button');
    for (var i = 0; i < btns.length; i++) {
      btns[i].classList.toggle('on', btns[i].getAttribute('data-theme') === currentTheme);
    }
  }

  function num(v, d) { var n = parseFloat(v); return isFinite(n) ? n : d; }
  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  function group(n) { return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ','); }
  function parseHM(s) {
    var p = String(s).split(':');
    var h = parseInt(p[0], 10), m = parseInt(p[1], 10);
    return (isFinite(h) ? h : 0) * 3600 + (isFinite(m) ? m : 0) * 60;
  }
  function floorTo(v, n) {
    var p = Math.pow(10, n);
    if (!isFinite(v) || v <= 0) return 0;
    return Math.floor(v * p + 1e-7) / p;
  }
  function money(v) {
    var s = v.toFixed(2).split('.');
    return group(s[0]) + '.' + s[1];
  }

  function readForm() {
    return {
      salary: Math.max(0, num(el.salary.value, 0)),
      days: Math.max(1, num(el.days.value, 22)),
      start: el.start.value || '09:00',
      end: el.end.value || '18:00',
      lunch: Math.max(0, num(el.lunch.value, 0)),
      restMode: currentRest,
      theme: currentTheme,
      character: 'webm',
      animation: document.getElementById('animation').checked,
      petScale: Number(document.getElementById("petScale").value)
    };
  }

  function summarize(c) {
    var ws = parseHM(c.start), we = parseHM(c.end);
    var span = we - ws;
    var workSec = span - c.lunch * 3600;
    var dayPay = c.salary / Math.max(1, c.days);
    var perSec = workSec > 0 ? dayPay / workSec : 0;

    el.perDay.textContent = '¥' + money(floorTo(dayPay, 2));

    // 本月估算：本月已过完的工作日 × 日薪 + 今日已赚
    var now = new Date();
    var done = 0;
    for (var i = 1; i < now.getDate(); i++) {
      if (!restOn(new Date(now.getFullYear(), now.getMonth(), i), c.restMode)) done++;
    }

    var nowSec = now.getHours() * 3600 + now.getMinutes() * 60 + now.getSeconds();
    var isRest = restOn(now, c.restMode);
    var L0 = 12 * 3600;
    if (L0 < ws) L0 = ws;
    if (L0 + c.lunch * 3600 > we) L0 = we - c.lunch * 3600;
    var lunchSec = c.lunch * 3600;
    var overlap = 0;
    if (lunchSec > 0) {
      if (nowSec <= L0) overlap = 0;
      else if (nowSec >= L0 + lunchSec) overlap = lunchSec;
      else overlap = nowSec - L0;
    }
    var raw = nowSec > ws ? Math.min(nowSec, we) - ws : 0;
    var billable = Math.max(0, Math.min(workSec, raw - overlap));
    var earned = isRest ? 0 : perSec * billable;

    el.perMonth.textContent = '¥' + money(floorTo(done * dayPay + earned, 2));

    if (span <= 0) el.diag.textContent = '下班时间必须晚于上班时间';
    else if (workSec <= 0) el.diag.textContent = '午休时长超过了在岗时长';
    else el.diag.textContent = '';
  }

  function fill(c) {
    el.salary.value = c.salary;
    el.days.value = c.days;
    el.start.value = c.start;
    el.end.value = c.end;
    el.lunch.value = c.lunch;
    setRest(c.restMode || (c.weekend ? 'none' : 'double'));    setTheme(c.theme);
    document.getElementById("petScale").value = c.petScale || 130;
    document.getElementById("petScaleValue").textContent = (c.petScale || 130) + "%";
    document.getElementById("animation").checked = c.animation !== false;
  }

  document.getElementById('petScale').addEventListener('input', function () {
    document.getElementById('petScaleValue').textContent = this.value + '%';
    push();
  });
  document.getElementById('resetPetScale').addEventListener('click', function () {
    document.getElementById('petScale').value = 130;
    document.getElementById('petScaleValue').textContent = '130%';
    push();
  });
  document.getElementById('animation').addEventListener('change', push);
  var timer = null;
  function push() {
    cfg = readForm();
    summarize(cfg);
    clearTimeout(timer);
    timer = setTimeout(function () { api.setConfig(cfg); }, 120);
  }

  ['salary', 'days', 'start', 'end', 'lunch'].forEach(function (k) {
    el[k].addEventListener('input', push);
  });
  var restBtns = document.querySelectorAll('#segRest button');
  for (var r = 0; r < restBtns.length; r++) {
    restBtns[r].addEventListener('click', function () {
      setRest(this.getAttribute('data-rest'), true);
      push();
    });
  }

  var segBtns = document.querySelectorAll('#seg button');
  for (var i = 0; i < segBtns.length; i++) {
    segBtns[i].addEventListener('click', function () {
      setTheme(this.getAttribute('data-theme'));
      push();
    });
  }

  /* ---------------- 自检 ---------------- */
  function showCheck(report) {
    var today = report.today || {};
    var prices = report.prices || {};
    el.checkLine.textContent = '今日已算 ' + (today.known || 0) + ' 笔、未算 ' + (today.unknown || 0)
      + ' 笔，合计 ¥' + Number(today.expense || 0).toFixed(2)
      + '；价格表：' + (prices.source || '内置') + (prices.count ? '，' + prices.count + ' 个模型' : '');
    if (typeof report.sessions === 'number') {
      el.checkResult.textContent = '（扫了 ' + report.sessions + ' 个今天的会话）';
    }
  }

  el.recompute.addEventListener('click', function () {
    el.recompute.disabled = true;
    el.checkResult.textContent = '正在重算…';
    api.recompute().then(function (report) {
      showCheck(report);
    }).catch(function () {
      el.checkResult.textContent = '重算失败，请再试一次';
    }).then(function () {
      el.recompute.disabled = false;
    });
  });

  function showTps(report) {
    if (!report || !Object.prototype.hasOwnProperty.call(report, 'tps')) return;
    el.perToken.textContent = typeof report.tps === 'number' && isFinite(report.tps)
      ? report.tps.toFixed(1) : '—';
  }
  var tpsTimer = setInterval(function () {
    api.getState().then(showTps).catch(function () {});
  }, 5000);
  window.addEventListener('pagehide', function () { clearInterval(tpsTimer); });
  api.getState().then(function (report) { showCheck(report); showTps(report); }).catch(function () {
    el.checkLine.textContent = '自检读取失败';
  });

  api.getConfig().then(function (c) {
    cfg = Object.assign({}, DEF, c || {});
    fill(cfg);
    summarize(cfg);
  });
})();
</script>
</body>
</html>
