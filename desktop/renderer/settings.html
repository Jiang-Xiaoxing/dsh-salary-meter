<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'">
<title>设置</title>
<style>
  :root{
    --panel:#202c3d;
    --surface:#263447;
    --control:#182333;
    --ink:#edf3ff;
    --ink-2:#c1d0e5;
    --ink-3:#93a7c1;
    --rule:#455872;
    --accent:#9eb6e4;
    --accent-ink:#1b2738;
    --focus-ring:rgba(158,182,228,.22);
    --danger:#f09a9a;
    --cost:#e8c18d;
  }

  *{box-sizing:border-box}
  html,body,input,button,select,textarea{-webkit-app-region:no-drag}
  html,body{margin:0;padding:0}

  body{
    background:transparent;
    color:var(--ink);
    font-family:'Salary Noto Sans SC',system-ui,-apple-system,'Segoe UI','Microsoft YaHei UI','Microsoft YaHei',sans-serif;
    font-size:12px;
    line-height:1.5;
    padding:16px 24px 20px;
    min-height:100vh;
    scrollbar-color:var(--rule) transparent;
  }

  .settings-page{display:flex;flex-direction:column}
  .settings-section{display:flex;flex-direction:column;gap:9px;padding-bottom:14px}
  .settings-section + .settings-section{border-top:1px solid var(--rule);padding-top:14px}
  .settings-section h2{
    margin:0 0 1px;font-size:12px;line-height:1.4;font-weight:500;color:var(--ink-2);
    letter-spacing:.02em;
  }

  .row2{display:grid;grid-template-columns:1fr 1fr;gap:9px 16px}
  .field{display:flex;flex-direction:column;gap:5px;min-width:0}
  .field > label,.line-label{font-size:11px;line-height:1.4;color:var(--ink-2);letter-spacing:0}
  .control{position:relative;display:block;min-width:0}
  .control .unit{
    position:absolute;right:10px;top:50%;transform:translateY(-50%);
    font-size:11px;color:var(--ink-3);pointer-events:none;
  }
  .control.has-unit input{padding-right:36px}

  input[type=number],input[type=time]{
    width:100%;height:36px;
    font-family:inherit;font-size:13px;font-variant-numeric:tabular-nums;
    color:var(--ink);background:var(--control);
    border:1px solid var(--rule);border-radius:8px;
    padding:0 10px;box-shadow:none;
    transition:border-color .15s ease,box-shadow .15s ease,background .15s ease;
  }
  input[type=number]:hover,input[type=time]:hover{border-color:var(--ink-3)}
  input[type=number]:focus,input[type=time]:focus{
    outline:none;border-color:var(--accent);background:var(--surface);
    box-shadow:0 0 0 3px var(--focus-ring);
  }

  .setting-line{display:flex;flex-direction:row;align-items:center;justify-content:space-between;gap:12px;min-height:36px}
  .setting-line .control{width:120px;flex:none}
  .setting-line .seg{width:190px;flex:none}

  .seg{
    display:grid;grid-template-columns:1fr 1fr 1fr;gap:2px;
    padding:2px;border:1px solid var(--rule);border-radius:8px;
    background:var(--control);
  }
  .seg button{
    font:inherit;font-size:11px;line-height:26px;
    min-height:28px;padding:0 8px;border:0;border-radius:6px;
    background:transparent;color:var(--ink-2);cursor:pointer;
    transition:background .15s ease,color .15s ease;
    white-space:nowrap;
  }
  .seg button:hover{background:var(--rule);color:var(--ink)}
  .seg button.on,.seg button.on:hover{background:var(--accent);color:var(--accent-ink);font-weight:500}
  .seg button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
  .seg.three{grid-template-columns:1fr 1fr 1fr}

  .size-line{
    display:grid;grid-template-columns:auto minmax(0,1fr) auto;
    align-items:center;gap:12px;min-height:32px;
  }
  .size-line > label{white-space:nowrap;font-size:11px;color:var(--ink-2)}
  .size-line output{color:var(--ink);font-variant-numeric:tabular-nums}
  input[type=range]{
    width:100%;min-width:0;height:22px;margin:0;cursor:ew-resize;
    -webkit-appearance:none;appearance:none;background:transparent;
  }
  input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:var(--rule)}
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;width:15px;height:15px;margin-top:-5.5px;
    border-radius:50%;background:var(--accent);
    border:2px solid var(--panel);box-shadow:0 0 0 1px var(--accent);
  }
  input[type=range]:focus-visible{outline:none}
  input[type=range]:focus-visible::-webkit-slider-thumb{box-shadow:0 0 0 3px var(--focus-ring),0 0 0 1px var(--accent)}
  input[type=range]:disabled{cursor:default;opacity:.4}
  #resetPetScale{
    border:0;padding:4px 0;background:transparent;color:var(--accent);
    font:inherit;font-size:11px;cursor:pointer;white-space:nowrap;
  }
  #resetPetScale:hover{text-decoration:underline;text-underline-offset:3px}
  #resetPetScale:disabled{color:var(--ink-3);opacity:.55;cursor:default;text-decoration:none}

  /* 人物动画开关：独立成行，说明在下方；轨道不铺一整块白底。 */
  .anim-row{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;padding:2px 0 0}
  .anim-copy{min-width:0}
  .anim-copy b{display:block;font-size:12px;line-height:1.4;font-weight:500;color:var(--ink)}
  .anim-copy p{margin:3px 0 0;font-size:10.5px;line-height:1.5;color:var(--ink-3)}
  .switch{position:relative;flex:none;width:38px;height:22px;margin-top:1px;cursor:pointer}
  .switch input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer;z-index:2}
  .switch-track{
    position:absolute;inset:0;border-radius:11px;
    background:var(--control);border:1px solid var(--rule);
    transition:background .16s ease,border-color .16s ease;
  }
  .switch-track::after{
    content:'';position:absolute;left:2px;top:2px;width:16px;height:16px;border-radius:50%;
    background:var(--ink-3);transition:transform .16s ease,background .16s ease;
  }
  .switch input:checked + .switch-track{background:var(--accent);border-color:var(--accent)}
  .switch input:checked + .switch-track::after{background:var(--accent-ink);transform:translateX(16px)}
  .switch input:focus-visible + .switch-track{box-shadow:0 0 0 3px var(--focus-ring)}

  .stats{
    display:grid;grid-template-columns:1fr 1.2fr 1.2fr;gap:0;
    margin-top:14px;padding:12px 0 3px;border-top:1px solid var(--rule);
  }
  .stat{padding:0 12px;min-width:0;border-right:1px solid var(--rule)}
  .stat:first-child{padding-left:0}
  .stat:last-child{border-right:0;padding-right:0}
  .stat b{
    display:block;font-size:15px;font-weight:500;line-height:1.3;
    font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--ink);
  }
  .stat span{display:block;margin-top:3px;font-size:10px;line-height:1.4;color:var(--ink-3);white-space:nowrap}
  .stat.hi b{color:var(--ink)}

  .diagnostics{
    margin-top:8px;padding-top:8px;border-top:1px solid var(--rule);
    color:var(--ink-2);font-size:11px;
  }
  .diagnostics summary{
    display:flex;align-items:center;gap:7px;min-height:26px;
    list-style:none;cursor:pointer;color:var(--ink-2);
  }
  .diagnostics summary::-webkit-details-marker{display:none}
  .diagnostics summary::before{
    content:'›';display:inline-block;color:var(--ink-3);font-size:16px;line-height:1;
    transform:translateY(-1px);transition:transform .15s ease;
  }
  .diagnostics[open] summary::before{transform:rotate(90deg) translateX(-1px)}
  .diagnostics[open] summary{margin-bottom:6px;color:var(--ink)}
  .checkline{
    margin:0;color:var(--ink-2);font-size:10.5px;line-height:1.6;
    font-variant-numeric:tabular-nums;
  }
  .diagRow{display:flex;align-items:center;gap:10px;margin-top:7px;flex-wrap:wrap}
  #recompute{
    font:inherit;font-size:11px;line-height:1;padding:7px 11px;
    color:var(--ink);background:var(--control);
    border:1px solid var(--rule);border-radius:7px;cursor:pointer;
    transition:background .15s ease,border-color .15s ease;
  }
  #recompute:hover{background:var(--surface);border-color:var(--ink-3)}
  #recompute:focus-visible{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--focus-ring)}
  #recompute:disabled{opacity:.45;cursor:default}

  .diag{color:var(--danger);font-size:10.5px;line-height:1.5;min-height:0}
  .diag:empty{display:none}

  .foot{margin-top:6px;padding-top:8px;border-top:1px solid var(--rule)}
  .hint{margin:0;font-size:10px;line-height:1.6;color:var(--ink-3)}
</style>
<link rel="stylesheet" href="assets/fonts.css">
<link rel="stylesheet" href="assets/settings-theme.css">
</head>
<body data-settings-theme="dark">

<div class="settings-page">
  <section class="settings-section">
    <h2>工资与作息</h2>
    <div class="row2">
      <div class="field"><label for="salary">月薪（税后）</label><div class="control has-unit"><input id="salary" type="number" min="0" step="100" inputmode="decimal"><span class="unit">元</span></div></div>
      <div class="field"><label for="days">每月工作日</label><div class="control has-unit"><input id="days" type="number" min="1" max="31" step="0.5" inputmode="decimal"><span class="unit">天</span></div></div>
    </div>
    <div class="row2">
      <div class="field"><label for="start">上班时间</label><div class="control"><input id="start" type="time"></div></div>
      <div class="field"><label for="end">下班时间</label><div class="control"><input id="end" type="time"></div></div>
    </div>
    <div class="field setting-line"><label class="line-label" for="lunch">午休</label><div class="control has-unit"><input id="lunch" type="number" min="0" max="6" step="0.5" inputmode="decimal"><span class="unit">小时</span></div></div>
    <div class="field setting-line"><span class="line-label">休息制度</span><div class="seg three" id="segRest"><button type="button" data-rest="double">双休</button><button type="button" data-rest="single">单休</button><button type="button" data-rest="alternate">大小周</button></div></div>
  </section>

  <section class="settings-section">
    <h2>挂件外观</h2>
    <div class="field setting-line"><span class="line-label">配色</span><div class="seg" id="seg"><button type="button" data-theme="dark">深色</button><button type="button" data-theme="light">浅白</button><button type="button" data-theme="gold">暗金</button></div></div>
    <div class="field size-line"><label for="petScale">大小 <output id="petScaleValue">130%</output></label><input id="petScale" type="range" min="80" max="160" step="5" value="130"><button id="resetPetScale" type="button">恢复默认</button></div>
    <div class="anim-row">
      <div class="anim-copy">
        <b id="animationLabel">加载人物动画</b>
        <p id="animationHint">关闭后保留鱼粮和账目，可减少内存占用</p>
      </div>
      <label class="switch">
        <input type="checkbox" id="animation" role="switch" aria-labelledby="animationLabel" aria-describedby="animationHint" checked>
        <span class="switch-track" aria-hidden="true"></span>
      </label>
    </div>
  </section>

  <div class="stats">
    <div class="stat"><b id="perDay">¥0.00</b><span>每天</span></div>
    <div class="stat hi"><b id="perMonth">¥0.00</b><span>本月累计 · 估算</span></div>
    <div class="stat"><b id="perToken">—</b><span title="最近60分钟合格已完成回答的总输出token ÷ 总流时长（不含空闲时间）">近1小时 token/s</span></div>
  </div>

  <details class="diagnostics">
    <summary>账目自检与价格信息</summary>
    <p class="checkline" id="checkLine">正在读取…</p>
    <div class="diagRow"><button type="button" id="recompute">重算今天的账</button><span class="checkline" id="checkResult"></span></div>
  </details>
  <div class="diag" id="diag"></div>
  <div class="foot"><p class="hint">费用按已识别 token 估算 · 退出挂件请使用托盘菜单</p></div>
</div>

<script src="tauri-shim.js"></script>
<script>
(function () {
  "use strict";

  var DEF = { salary: 5000, days: 22, start: '09:00', end: '18:00', lunch: 1, weekend: false, restMode: 'double', theme: 'dark', animation: true, petScale: 130 };
  // 设置页现在是主窗口里的浮层 iframe：优先用宿主窗口的 api，单独打开时才走兜底
  var hostApi = null;
  try { hostApi = (window.parent && window.parent !== window) ? window.parent.api : null; } catch (e) { hostApi = null; }
  var api = hostApi || window.api || {
    getConfig: function () {
      var s = {};
      try { s = JSON.parse(localStorage.getItem('salary-widget-cfg') || '{}'); } catch (e) {}
      return Promise.resolve(Object.assign({}, DEF, s));
    },
    setConfig: function (p) { try { localStorage.setItem('salary-widget-cfg', JSON.stringify(Object.assign({}, DEF, p))); } catch (e) {} },
    getState: function () { return Promise.resolve({ today: { expense: 0, known: 0, unknown: 0 }, prices: { source: '内置', count: 0 }, sessions: 0 }); },
    recompute: function () { return Promise.resolve({ today: { expense: 0, known: 0, unknown: 0 }, prices: { source: '内置', count: 0 }, sessions: 0 }); }
  };

  var el = {
    salary: document.getElementById('salary'),
    days: document.getElementById('days'),
    start: document.getElementById('start'),
    end: document.getElementById('end'),
    lunch: document.getElementById('lunch'),
    animation: document.getElementById('animation'),
    petScale: document.getElementById('petScale'),
    petScaleValue: document.getElementById('petScaleValue'),
    resetPetScale: document.getElementById('resetPetScale'),
    diag: document.getElementById('diag'),
    perToken: document.getElementById('perToken'),
    perDay: document.getElementById('perDay'),
    perMonth: document.getElementById('perMonth'),
    checkLine: document.getElementById('checkLine'),
    checkResult: document.getElementById('checkResult'),
    recompute: document.getElementById('recompute')
  };

  var cfg = Object.assign({}, DEF);
  var currentTheme = 'dark';
  var currentRest = 'double';

  /* 休息制度：double 双休 / single 单休（只休周日）/ alternate 大小周（周六逢双周休） */
  /* 大小周周序号用固定基准连续算，跟挂件同一套规则，不按自然年重置 */
  var WEEK0 = Date.UTC(2026, 0, 5); // 2026-01-05 是周一，作为第 0 周
  function weekIndex(d) {
    var t = Date.UTC(d.getFullYear(), d.getMonth(), d.getDate());
    return Math.floor((t - WEEK0) / 604800000);
  }
  function restOn(d, mode) {
    var wd = d.getDay();
    if (wd !== 0 && wd !== 6) return false;
    if (mode === 'none') return false;
    if (mode === 'single') return wd === 0;
    if (mode === 'alternate') return wd === 0 || weekIndex(d) % 2 === 0;
    return true;
  }
  function setRest(v, syncDays) {
    currentRest = (v === 'single' || v === 'alternate' || v === 'none') ? v : 'double';
    var btns = document.querySelectorAll('#segRest button');
    for (var i = 0; i < btns.length; i++) {
      btns[i].classList.toggle('on', btns[i].getAttribute('data-rest') === currentRest);
    }
    // 用户手动切换制度时，把「每月工作日」带成常见值，免得月累计超过月薪
    if (syncDays) {
      var preset = { double: 22, single: 26, alternate: 24 };
      if (preset[currentRest]) el.days.value = preset[currentRest];
    }
  }

  function setTheme(t) {
    currentTheme = (t === 'light' || t === 'gold') ? t : 'dark';
    document.body.dataset.settingsTheme = currentTheme;
    try {
      var layer = window.parent.document.getElementById('settingsLayer');
      if (layer) layer.dataset.settingsTheme = currentTheme;
    } catch (e) {}
    var btns = document.querySelectorAll('#seg button');
    for (var i = 0; i < btns.length; i++) {
      btns[i].classList.toggle('on', btns[i].getAttribute('data-theme') === currentTheme);
    }
  }

  function num(v, d) { var n = parseFloat(v); return isFinite(n) ? n : d; }
  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  function group(n) { return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ','); }
  function parseHM(s) {
    var p = String(s).split(':');
    var h = parseInt(p[0], 10), m = parseInt(p[1], 10);
    return (isFinite(h) ? h : 0) * 3600 + (isFinite(m) ? m : 0) * 60;
  }
  function floorTo(v, n) {
    var p = Math.pow(10, n);
    if (!isFinite(v) || v <= 0) return 0;
    return Math.floor(v * p + 1e-7) / p;
  }
  function money(v) {
    var s = v.toFixed(2).split('.');
    return group(s[0]) + '.' + s[1];
  }

  /* 人物关闭时只停用「大小」和「恢复默认」；大小值保留，重开可直接恢复。 */
  function applyAnimationAvailability() {
    var off = !el.animation.checked;
    el.petScale.disabled = off;
    el.resetPetScale.disabled = off;
  }

  function readForm() {
    return {
      salary: Math.max(0, num(el.salary.value, 0)),
      days: Math.max(1, num(el.days.value, 22)),
      start: el.start.value || '09:00',
      end: el.end.value || '18:00',
      lunch: Math.max(0, num(el.lunch.value, 0)),
      restMode: currentRest,
      theme: currentTheme,
      character: 'webm',
      animation: el.animation.checked,
      petScale: Number(el.petScale.value)
    };
  }

  function summarize(c) {
    var ws = parseHM(c.start), we = parseHM(c.end);
    var span = we - ws;
    var workSec = span - c.lunch * 3600;
    var dayPay = c.salary / Math.max(1, c.days);
    var perSec = workSec > 0 ? dayPay / workSec : 0;

    el.perDay.textContent = '¥' + money(floorTo(dayPay, 2));

    // 本月估算：本月已过完的工作日 × 日薪 + 今日已赚
    var now = new Date();
    var done = 0;
    for (var i = 1; i < now.getDate(); i++) {
      if (!restOn(new Date(now.getFullYear(), now.getMonth(), i), c.restMode)) done++;
    }

    var nowSec = now.getHours() * 3600 + now.getMinutes() * 60 + now.getSeconds();
    var isRest = restOn(now, c.restMode);
    var L0 = 12 * 3600;
    if (L0 < ws) L0 = ws;
    if (L0 + c.lunch * 3600 > we) L0 = we - c.lunch * 3600;
    var lunchSec = c.lunch * 3600;
    var overlap = 0;
    if (lunchSec > 0) {
      if (nowSec <= L0) overlap = 0;
      else if (nowSec >= L0 + lunchSec) overlap = lunchSec;
      else overlap = nowSec - L0;
    }
    var raw = nowSec > ws ? Math.min(nowSec, we) - ws : 0;
    var billable = Math.max(0, Math.min(workSec, raw - overlap));
    var earned = isRest ? 0 : perSec * billable;

    el.perMonth.textContent = '¥' + money(floorTo(done * dayPay + earned, 2));

    if (span <= 0) el.diag.textContent = '下班时间必须晚于上班时间';
    else if (workSec <= 0) el.diag.textContent = '午休时长超过了在岗时长';
    else el.diag.textContent = '';
  }

  function fill(c) {
    el.salary.value = c.salary;
    el.days.value = c.days;
    el.start.value = c.start;
    el.end.value = c.end;
    el.lunch.value = c.lunch;
    setRest(c.restMode || (c.weekend ? 'none' : 'double'));
    setTheme(c.theme);
    el.petScale.value = c.petScale || 130;
    el.petScaleValue.textContent = (c.petScale || 130) + '%';
    el.animation.checked = c.animation !== false;
    applyAnimationAvailability();
  }

  el.petScale.addEventListener('input', function () {
    el.petScaleValue.textContent = this.value + '%';
    push();
  });
  el.resetPetScale.addEventListener('click', function () {
    el.petScale.value = 130;
    el.petScaleValue.textContent = '130%';
    push();
  });
  el.animation.addEventListener('change', function () {
    applyAnimationAvailability();
    push();
  });
  var timer = null;
  function push() {
    cfg = readForm();
    summarize(cfg);
    clearTimeout(timer);
    timer = setTimeout(function () {
      var saved = api.setConfig(cfg);
      if (saved && typeof saved.catch === 'function') {
        saved.catch(function () { el.diag.textContent = '保存失败，请再试一次'; });
      }
    }, 120);
  }

  ['salary', 'days', 'start', 'end', 'lunch'].forEach(function (k) {
    el[k].addEventListener('input', push);
  });
  var restBtns = document.querySelectorAll('#segRest button');
  for (var r = 0; r < restBtns.length; r++) {
    restBtns[r].addEventListener('click', function () {
      setRest(this.getAttribute('data-rest'), true);
      push();
    });
  }

  var segBtns = document.querySelectorAll('#seg button');
  for (var i = 0; i < segBtns.length; i++) {
    segBtns[i].addEventListener('click', function () {
      setTheme(this.getAttribute('data-theme'));
      push();
    });
  }

  /* ---------------- 自检 ---------------- */
  function showCheck(report) {
    var today = report.today || {};
    var prices = report.prices || {};
    el.checkLine.textContent = '今日已算 ' + (today.known || 0) + ' 笔、未算 ' + (today.unknown || 0)
      + ' 笔，合计 ¥' + Number(today.expense || 0).toFixed(2)
      + '；价格表：' + (prices.source || '内置') + (prices.count ? '，' + prices.count + ' 个模型' : '');
    if (typeof report.sessions === 'number') {
      el.checkResult.textContent = '（扫了 ' + report.sessions + ' 个今天的会话）';
    }
  }

  el.recompute.addEventListener('click', function () {
    el.recompute.disabled = true;
    el.checkResult.textContent = '正在重算…';
    api.recompute().then(function (report) {
      showCheck(report);
    }).catch(function () {
      el.checkResult.textContent = '重算失败，请再试一次';
    }).then(function () {
      el.recompute.disabled = false;
    });
  });

  function showTps(report) {
    if (!report || !Object.prototype.hasOwnProperty.call(report, 'tps')) return;
    el.perToken.textContent = typeof report.tps === 'number' && isFinite(report.tps)
      ? report.tps.toFixed(1) : '—';
  }
  var tpsTimer = setInterval(function () {
    api.getState().then(showTps).catch(function () {});
  }, 5000);
  window.addEventListener('pagehide', function () { clearInterval(tpsTimer); });
  api.getState().then(function (report) { showCheck(report); showTps(report); }).catch(function () {
    el.checkLine.textContent = '自检读取失败';
  });

  api.getConfig().then(function (c) {
    cfg = Object.assign({}, DEF, c || {});
    fill(cfg);
    summarize(cfg);
  });
})();
</script>
</body>
</html>
