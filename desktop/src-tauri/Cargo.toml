[package]
name = "salary-widget"
version = "0.1.0"
description = "桌面工资计价器"
edition = "2021"
rust-version = "1.77"

[lib]
name = "salary_widget_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zstd = "0.13"

# 读系统空闲时间（GetLastInputInfo），判断用户是不是正在用电脑
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_System_SystemInformation",
] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
